<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 130"><defs>
<linearGradient id="shm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4248b3"/><stop offset=".55" stop-color="#2a2e7c"/><stop offset="1" stop-color="#171a4f"/></linearGradient>
<linearGradient id="rimm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe082"/><stop offset=".5" stop-color="#f5b301"/><stop offset="1" stop-color="#c98a00"/></linearGradient>
<linearGradient id="pgLm" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e9ebfa"/></linearGradient>
<linearGradient id="pgRm" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dfe2f6"/></linearGradient>
